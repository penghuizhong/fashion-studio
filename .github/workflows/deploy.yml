name: Build and deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install server deps
        working-directory: server
        run: npm ci
      - name: Regression (single-user)
        working-directory: server
        run: node scripts/check.js
      - name: Regression (multi-user)
        working-directory: server
        run: CHECK_MODE=multi node scripts/check.js
      - name: Build client
        working-directory: client
        run: |
          npm ci
          npm run build

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build client
        working-directory: client
        run: |
          npm ci
          npm run build
      - name: Extract version
        id: version
        run: echo "version=$(node -p "require('./server/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/penghuizhong/soulchat:latest
            ghcr.io/penghuizhong/soulchat:v${{ steps.version.outputs.version }}
            ghcr.io/penghuizhong/soulchat:${{ github.sha }}
