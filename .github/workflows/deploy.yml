name: Test and deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install server deps
        working-directory: server
        run: npm ci
      - name: Regression (single-user)
        working-directory: server
        run: node scripts/check.js
      - name: Regression (multi-user)
        working-directory: server
        run: CHECK_MODE=multi node scripts/check.js
      - name: Style versions, billing and migration regression
        working-directory: server
        run: npm run check:style
      - name: Build client
        working-directory: client
        run: |
          npm ci
          npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: 43.130.1.94
          port: 28989
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            if [ ! -d /opt/fashion-studio/.git ]; then
              git clone https://github.com/penghuizhong/fashion-studio.git /opt/fashion-studio
            fi
            cd /opt/fashion-studio
            git fetch origin main
            git reset --hard origin/main
            cd server && npm ci --omit=dev
            cd ../client && npm ci && npm run build
            systemctl restart fashion-studio
            sleep 3
            curl -sf http://127.0.0.1:3100/api/config | head -c 200
